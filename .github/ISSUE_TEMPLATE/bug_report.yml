name: Bug report
description: Report a problem with Lox Lorax
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove personal information before attaching logs.
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: 1.0.7
    validations:
      required: true
  - type: input
    id: valheim
    attributes:
      label: Valheim version
    validations:
      required: true
  - type: input
    id: bepinex
    attributes:
      label: BepInExPack version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the creature, location, animation, and whether F8 toggling changes the result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other installed mods
  - type: textarea
    id: logs
    attributes:
      label: Relevant BepInEx log excerpt
      description: Paste only the relevant lines and remove usernames, world names, server addresses, and other private data.
